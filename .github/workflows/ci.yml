name: MedFact CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ml-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medfact/server_ml/requirements.txt

      - name: Seed PubMed Vector Database
        run: |
          python mlops/scripts/seed_pubmed.py

      - name: Run ML Training Pipeline & MLOps Evaluation
        run: |
          python mlops/scripts/train_pipeline.py

      - name: Run Pytest Test Suite
        run: |
          pytest medfact/server_ml/tests -v --tb=short

      - name: Run Data Drift Telemetry Check
        run: |
          python mlops/scripts/monitor_drift.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        working-directory: ./medfact/client
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./medfact/client
        run: npm run build

  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: |
          pip install mkdocs mkdocs-material

      - name: Build Documentation Site
        run: |
          mkdocs build --strict
